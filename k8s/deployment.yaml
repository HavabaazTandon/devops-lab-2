apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab2-app
  template:
    metadata:
      labels:
        app: lab2-app
    spec:
      containers:
        - name: lab2-app
          image: aaryantandon/devops-lab2-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
